name: release

# Publishing a GitHub release tagged vX.Y.Z (or vX.Y.Z-suffix) tests and publishes that version to npm with provenance.
# Nothing else publishes: a push to main never does.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing: GitHub proves this workflow's identity, npm accepts it instead of a token.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag must match package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "The release tag '$GITHUB_REF_NAME' does not match package.json version '$declared'." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      # Trusted Publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
