name: release

# Publishing a GitHub release tagged vX.Y.Z (or vX.Y.Z-suffix) tests and publishes that version to npm with provenance.
# Nothing else publishes: a push to main never does.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing: GitHub proves this workflow's identity, npm accepts it instead of a token.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag must match package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "The release tag '$GITHUB_REF_NAME' does not match package.json version '$declared'." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Publish with the matching npm release tag
        env:
          # Only for the very first publish, before the package exists and Trusted Publishing can be configured on
          # it. Once Trusted Publishing is on, the NPM_TOKEN environment secret is deleted, this is empty, and npm
          # authenticates with the workflow's OIDC identity instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
